<div style="font-family: system-ui, sans-serif; max-width: 480px; margin: 0 auto; padding: 24px; color: #0f172a">
  <h2 style="margin: 0 0 12px">Sign in to taktiks</h2>
  <p style="margin: 0 0 16px; color: #475569">
    Enter this code on the device where you are signing in. It expires in one hour and can only be used once.
  </p>
  <p
    style="margin: 0 0 20px; font-size: 32px; font-weight: 700; letter-spacing: 0.28em; text-align: center"
  >
    {{ .Token }}
  </p>
  <p style="margin: 0 0 16px; color: #475569">Or use the button. It signs you in on the device that opens it.</p>
  <a
    href="{{ .RedirectTo }}&token_hash={{ .TokenHash }}&type=magiclink"
    style="display: inline-block; background: #16a34a; color: #fff; padding: 10px 18px; border-radius: 8px; text-decoration: none; font-weight: 600"
    >Sign in</a
  >
  <p style="margin: 20px 0 0; font-size: 12px; color: #94a3b8">If you didn't request this, you can ignore this email.</p>
</div>

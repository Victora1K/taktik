<div style="font-family: system-ui, sans-serif; max-width: 480px; margin: 0 auto; padding: 24px; color: #0f172a">
  <h2 style="margin: 0 0 12px">Sign in to Taktik</h2>
  <p style="margin: 0 0 20px; color: #475569">Click the button to sign in. The link expires in one hour and works on any device.</p>
  <a
    href="{{ .RedirectTo }}&token_hash={{ .TokenHash }}&type=magiclink"
    style="display: inline-block; background: #16a34a; color: #fff; padding: 10px 18px; border-radius: 8px; text-decoration: none; font-weight: 600"
    >Sign in</a
  >
  <p style="margin: 20px 0 0; font-size: 12px; color: #94a3b8">If you didn't request this, you can ignore this email.</p>
</div>
